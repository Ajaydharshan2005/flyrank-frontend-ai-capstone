<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>Account settings</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="src/settings.js"></script>
  </head>
  <body>
    <main class="settings-page">
      <header class="page-heading">
        <p class="eyebrow">YOUR ACCOUNT</p>
        <h1>Settings</h1>
        <p class="intro">Manage your profile and email preferences.</p>
      </header>

      <form id="settings-form" novalidate>
        <section class="form-section" aria-labelledby="profile-heading">
          <h2 id="profile-heading">Profile</h2>

          <div class="field">
            <label for="display-name">Display name</label>
            <input
              id="display-name"
              name="displayName"
              type="text"
              autocomplete="name"
              aria-describedby="display-name-error"
              required
            />
            <p id="display-name-error" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              aria-describedby="email-error"
              required
            />
            <p id="email-error" class="field-error" hidden></p>
          </div>
        </section>

        <section class="form-section notification-section" aria-labelledby="notifications-heading">
          <div>
            <h2 id="notifications-heading">Email notifications</h2>
            <p class="section-description">Receive product updates and account notices.</p>
          </div>
          <label class="toggle-control" for="notifications">
            <span class="visually-hidden">Enable email notifications</span>
            <input id="notifications" name="notifications" type="checkbox" />
            <span class="toggle-track" aria-hidden="true"></span>
          </label>
        </section>

        <div class="form-actions">
          <button type="submit">Save settings</button>
          <p id="success-message" class="success-message" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>
  </body>
</html>
